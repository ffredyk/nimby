name: release

# Builds the portable Windows package and publishes it as a GitHub release.
#
#   git tag v0.9.0 && git push origin v0.9.0
#
# The tag must match the workspace version in Cargo.toml; the job fails otherwise
# so the zip and the sources never disagree.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    name: portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: Swatinem/rust-cache@v2

      - name: check version matches the tag
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Write-Host "workspace version: $version"
          if ("${{ github.ref_type }}" -eq 'tag') {
            $tag = "${{ github.ref_name }}"
            if ($tag -ne "v$version") {
              throw "tag $tag does not match Cargo.toml version $version"
            }
          }

      - name: format
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      - name: package
        shell: pwsh
        run: ./scripts/package.ps1 -Runtime win-x64

      - name: show package
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: portable
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Nimby ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Portable Windows build: download the zip, extract it anywhere and run
            `Nimby.exe`. No installer, no registry writes — configuration and the
            hash cache stay in the `data` folder next to the executable.

            - Website: https://nimby.ffredyk.cz
            - Verify the download against `SHA256SUMS.txt`
            - Licence: GPL-3.0-or-later (see `LICENSE`/`NOTICE` in the zip)
            - Brand assets are not covered by the licence.
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
            docs/screenshots/*.png
