name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: build
        run: cargo build --release

  rust-linux:
    name: rust (linux core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The CLI uses Windows-only calls for links and Arma discovery.
      - name: test core
        run: cargo test -p nimby-core

  gui:
    name: gui
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: build cli
        run: cargo build --release
      - name: build gui
        run: dotnet build gui/Nimby.App/Nimby.App.csproj -c Release
      - name: smoke
        shell: pwsh
        run: |
          $env:PATH = "$PWD\target\release;$env:PATH"
          $env:NIMBY_SMOKE = '1'
          & gui\Nimby.App\bin\Release\net10.0\Nimby.App.exe
          if ($LASTEXITCODE -ne 0) { throw "GUI smoke test failed" }
