[workspace]
resolver = "2"
members = ["crates/nimby-core", "crates/nimby-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nimby-arma/nimby"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
md-5 = "0.10"
sha1 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
walkdir = "2"
rayon = "1"
dirs = "5"
tempfile = "3"
url = "2"
